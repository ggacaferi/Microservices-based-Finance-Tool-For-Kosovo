events { worker_connections 1024; }

http {
  proxy_http_version 1.1;
  proxy_set_header   Host            $host;
  proxy_set_header   X-Real-IP       $remote_addr;
  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header   Connection      "";
  proxy_read_timeout 30s;

  server {
    listen 3000;

    # Make nginx-generated redirects (trailing-slash 301s) use relative
    # paths so the browser follows them to the same origin instead of
    # trying to resolve the internal Docker hostname.
    absolute_redirect off;
    port_in_redirect  off;

    location = /health {
      return 200 '{"status":"gateway ok"}';
      add_header Content-Type application/json;
    }

    # IAM :3001
    location /api/v1/iam/    { proxy_pass http://iam:3001; }
    location /api/v1/auth/   { proxy_pass http://iam:3001; }
    location /api/v1/health  { proxy_pass http://iam:3001; }

    # Compliance :3002
    location /api/v1/compliance/ { proxy_pass http://compliance:3002; }

    # Operations :3003
    location /api/v1/bills/      { proxy_pass http://operations:3003; }
    location /api/v1/invoices/   { proxy_pass http://operations:3003; }
    location /api/v1/inventory/  { proxy_pass http://operations:3003; }
    location /api/v1/operations/ { proxy_pass http://operations:3003; }

    # Ledger :3004
    location /api/v1/ledger/     { proxy_pass http://ledger:3004; }

    # AI :3005
    location /api/v1/ai/         { proxy_pass http://ai:3005; }

    # Frontend SPA :80
    location / { proxy_pass http://frontend:80; }
  }
}
