events { worker_connections 1024; }

http {
  # Use Docker's embedded DNS so upstream hostnames are re-resolved
  # whenever a container restarts (avoids stale-IP 502 errors).
  resolver 127.0.0.11 valid=5s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header   Host            $host;
  proxy_set_header   X-Real-IP       $remote_addr;
  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header   Connection      "";
  proxy_read_timeout 30s;

  # Upstream variables — required when using a resolver so nginx
  # performs DNS lookup at request time, not at startup.
  map $uri $iam_upstream         { default "http://iam:3001"; }
  map $uri $compliance_upstream  { default "http://compliance:3002"; }
  map $uri $operations_upstream  { default "http://operations:3003"; }
  map $uri $ledger_upstream      { default "http://ledger:3004"; }
  map $uri $ai_upstream          { default "http://ai:3005"; }
  map $uri $frontend_upstream    { default "http://frontend:80"; }

  server {
    listen 3000;

    absolute_redirect off;
    port_in_redirect  off;

    location = /health {
      return 200 '{"status":"gateway ok"}';
      add_header Content-Type application/json;
    }

    # IAM :3001
    location /api/v1/iam/    { set $upstream $iam_upstream;        proxy_pass $upstream; }
    location /api/v1/auth/   { set $upstream $iam_upstream;        proxy_pass $upstream; }
    location /api/v1/health  { set $upstream $iam_upstream;        proxy_pass $upstream; }

    # Compliance :3002
    location /api/v1/compliance/ { set $upstream $compliance_upstream; proxy_pass $upstream; }

    # Operations :3003
    location /api/v1/bills/      { set $upstream $operations_upstream; proxy_pass $upstream; }
    location /api/v1/invoices/   { set $upstream $operations_upstream; proxy_pass $upstream; }
    location /api/v1/inventory/  { set $upstream $operations_upstream; proxy_pass $upstream; }
    location /api/v1/operations/ { set $upstream $operations_upstream; proxy_pass $upstream; }
    location /api/v1/edi/        { set $upstream $operations_upstream; proxy_pass $upstream; }

    # Ledger :3004
    location /api/v1/ledger/     { set $upstream $ledger_upstream;     proxy_pass $upstream; }

    # AI :3005
    location /api/v1/ai/         { set $upstream $ai_upstream;         proxy_pass $upstream; }

    # Frontend SPA :80
    location / { set $upstream $frontend_upstream; proxy_pass $upstream; }
  }
}
