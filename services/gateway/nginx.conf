events { worker_connections 1024; }

http {
  # Docker Compose DNS — enables lazy resolution so nginx starts
  # even before all upstream services are ready.
  resolver 127.0.0.11 valid=10s;

  proxy_http_version 1.1;
  proxy_set_header   Host            $host;
  proxy_set_header   X-Real-IP       $remote_addr;
  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header   Connection      "";
  proxy_read_timeout 30s;

  server {
    listen 3000;

    location = /health {
      return 200 '{"status":"gateway ok"}';
      add_header Content-Type application/json;
    }

    # IAM :3001
    location /api/v1/iam/    { set $s iam;         proxy_pass http://$s:3001; }
    location /api/v1/auth/   { set $s iam;         proxy_pass http://$s:3001; }
    location /api/v1/health  { set $s iam;         proxy_pass http://$s:3001; }

    # Compliance :3002
    location /api/v1/compliance/ { set $s compliance;  proxy_pass http://$s:3002; }

    # Operations :3003
    location /api/v1/bills/      { set $s operations;  proxy_pass http://$s:3003; }
    location /api/v1/invoices/   { set $s operations;  proxy_pass http://$s:3003; }
    location /api/v1/inventory/  { set $s operations;  proxy_pass http://$s:3003; }
    location /api/v1/operations/ { set $s operations;  proxy_pass http://$s:3003; }

    # Ledger :3004
    location /api/v1/ledger/     { set $s ledger;      proxy_pass http://$s:3004; }

    # AI :3005
    location /api/v1/ai/         { set $s ai;          proxy_pass http://$s:3005; }

    # Frontend SPA :80
    location / { set $s frontend; proxy_pass http://$s:80; }
  }
}
