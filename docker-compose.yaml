# ──────────────────────────────────────────────────────────
# Docker Compose — Microservices Local Development
#
# Architecture:
#   gateway     (nginx :3000)  → routes all /api/v1/* traffic
#   iam         (NestJS :3001) → auth, RBAC, multi-tenant
#   compliance  (NestJS :3002) → Kosovo SKA rules distributor
#   operations  (NestJS :3003) → bills, invoices, inventory, storno
#   ledger      (NestJS :3004) → double-entry journal entries
#   ai          (NestJS :3005) → NL queries, financial snapshot
#   frontend    (Vite   :5173) → React SPA
#
# Usage:
#   docker compose up -d --build     # build + start everything
#   docker compose logs -f <service> # tail logs for one service
#   docker compose up -d --build iam # rebuild a single service
# ──────────────────────────────────────────────────────────
version: "3.9"

services:

  # ════════════════════════════════════════════════════════
  # DATABASES (one per bounded context)
  # ════════════════════════════════════════════════════════

  # ── IAM Database ──────────────────────────────────────
  iam-postgres:
    image: postgres:16-alpine
    container_name: guri-iam-db
    environment:
      POSTGRES_DB: guri_iam
      POSTGRES_USER: guri_iam
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - iam-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guri_iam"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Operations Database ───────────────────────────────
  ops-postgres:
    image: postgres:16-alpine
    container_name: guri-ops-db
    environment:
      POSTGRES_DB: guri_operations
      POSTGRES_USER: guri_ops
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - ops-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guri_ops"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Ledger Database ───────────────────────────────────
  ledger-postgres:
    image: postgres:16-alpine
    container_name: guri-ledger-db
    environment:
      POSTGRES_DB: guri_ledger
      POSTGRES_USER: guri_ledger
      POSTGRES_PASSWORD: localdev
    ports:
      - "5434:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guri_ledger"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── AI Database (pgvector) ────────────────────────────
  ai-postgres:
    image: pgvector/pgvector:pg16
    container_name: guri-ai-db
    environment:
      POSTGRES_DB: guri_ai
      POSTGRES_USER: guri_ai
      POSTGRES_PASSWORD: localdev
    ports:
      - "5435:5432"
    volumes:
      - ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guri_ai"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Google Cloud Pub/Sub Emulator ─────────────────────
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: guri-pubsub
    command: >
      gcloud beta emulators pubsub start
      --project=guri-finance-local
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    environment:
      PUBSUB_PROJECT_ID: guri-finance-local

  # ── Zookeeper (Kafka dependency) ──────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: guri-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ── Kafka Broker ──────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: guri-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ════════════════════════════════════════════════════════
  # MICROSERVICES
  # ════════════════════════════════════════════════════════

  # ── Compliance Service (:3002) ─────────────────────────
  compliance:
    build:
      context: ./services/compliance
      dockerfile: Dockerfile
    container_name: guri-compliance
    restart: unless-stopped
    environment:
      PORT: "3002"
      NODE_ENV: development
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/api/v1/compliance/summary || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── IAM Service (:3001) ────────────────────────────────
  iam:
    build:
      context: ./services/iam
      dockerfile: Dockerfile
    container_name: guri-iam
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: development
      IAM_DB_HOST: iam-postgres
      IAM_DB_PORT: "5432"
      IAM_DB_USER: guri_iam
      IAM_DB_PASSWORD: localdev
      IAM_DB_NAME: guri_iam
      JWT_SECRET: guri-finance-jwt-secret-2026
      # SMTP for email verification (set these in root .env)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@guri.local}
      # Shared with Operations for NUI → tenant lookup (cross-tenant incoming bills)
      IAM_OPS_SHARED_SECRET: ${IAM_OPS_SHARED_SECRET:-guri-internal-nui-lookup}
    ports:
      - "3001:3001"
    depends_on:
      iam-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Operations Service (:3003) ─────────────────────────
  operations:
    build:
      context: ./services/operations
      dockerfile: Dockerfile
    container_name: guri-operations
    restart: unless-stopped
    environment:
      PORT: "3003"
      NODE_ENV: development
      # Postgres
      OPS_DB_HOST: ops-postgres
      OPS_DB_PORT: "5432"
      OPS_DB_USER: guri_ops
      OPS_DB_PASSWORD: localdev
      OPS_DB_NAME: guri_operations
      # Peer service URLs
      COMPLIANCE_SERVICE_URL: http://compliance:3002
      LEDGER_SERVICE_URL: http://ledger:3004
      AI_SERVICE_URL: http://ai:3005
      IAM_SERVICE_URL: http://iam:3001
      IAM_OPS_SHARED_SECRET: ${IAM_OPS_SHARED_SECRET:-guri-internal-nui-lookup}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_OPERATIONS_EVENTS: operations.events
    ports:
      - "3003:3003"
    depends_on:
      iam:
        condition: service_healthy
      ops-postgres:
        condition: service_healthy
      compliance:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/v1/operations/activities || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ledger Service (:3004) ─────────────────────────────
  ledger:
    build:
      context: ./services/ledger
      dockerfile: Dockerfile
    container_name: guri-ledger
    restart: unless-stopped
    environment:
      PORT: "3004"
      NODE_ENV: development
      LEDGER_DB_HOST: ledger-postgres
      LEDGER_DB_PORT: "5432"
      LEDGER_DB_USER: guri_ledger
      LEDGER_DB_PASSWORD: localdev
      LEDGER_DB_NAME: guri_ledger
      AI_SERVICE_URL: http://ai:3005
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_OPERATIONS_EVENTS: operations.events
      KAFKA_TOPIC_LEDGER_EVENTS: ledger.events
    ports:
      - "3004:3004"
    depends_on:
      ledger-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/api/v1/ledger/summary || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI Service (:3005) ────────────────────────────────
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: guri-ai
    restart: unless-stopped
    env_file:
      - ./services/ai/.env
    environment:
      PORT: "3005"
      NODE_ENV: development
      AI_DB_HOST: ai-postgres
      AI_DB_PORT: "5432"
      AI_DB_USER: guri_ai
      AI_DB_PASSWORD: localdev
      AI_DB_NAME: guri_ai
      IAM_DB_HOST: iam-postgres
      IAM_DB_PORT: "5432"
      IAM_DB_USER: guri_iam
      IAM_DB_PASSWORD: localdev
      IAM_DB_NAME: guri_iam
      OPS_DB_HOST: ops-postgres
      OPS_DB_PORT: "5432"
      OPS_DB_USER: guri_ops
      OPS_DB_PASSWORD: localdev
      OPS_DB_NAME: guri_operations
      LEDGER_DB_HOST: ledger-postgres
      LEDGER_DB_PORT: "5432"
      LEDGER_DB_USER: guri_ledger
      LEDGER_DB_PASSWORD: localdev
      LEDGER_DB_NAME: guri_ledger
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_LEDGER_EVENTS: ledger.events
    ports:
      - "3005:3005"
    depends_on:
      ai-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (Vite SPA) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: guri-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway (nginx :3000) ─────────────────────────
  # Must start last — depends on all services being healthy
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: guri-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      compliance:
        condition: service_healthy
      iam:
        condition: service_healthy
      operations:
        condition: service_healthy
      ledger:
        condition: service_healthy
      ai:
        condition: service_healthy

volumes:
  iam-data:
  ops-data:
  ledger-data:
  ai-data:
