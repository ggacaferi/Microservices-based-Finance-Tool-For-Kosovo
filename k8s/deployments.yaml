# ──────────────────────────────────────────────────────────
# Application Deployments — One per bounded context
# All services share the same Docker image but receive
# different env vars pointing to their own Postgres DB.
#
# In a true microservice split, each would have its own
# image with only its bounded context code.
# ──────────────────────────────────────────────────────────

# ── API Gateway / Backend (all 5 services in monolith) ───
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: guri-finance
  labels:
    app: api-gateway
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
    spec:
      serviceAccountName: guri-pubsub-sa
      containers:
        - name: api
          image: gcr.io/guri-finance-prod/guri-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: guri-finance-config
            - configMapRef:
                name: iam-db-config
            - configMapRef:
                name: ops-db-config
            - configMapRef:
                name: ledger-db-config
            - configMapRef:
                name: ai-db-config
            - secretRef:
                name: db-secrets
            - secretRef:
                name: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: guri-finance
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

---
# ── Frontend (Nginx + React) ────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: guri-finance
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: gcr.io/guri-finance-prod/guri-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: guri-finance
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
