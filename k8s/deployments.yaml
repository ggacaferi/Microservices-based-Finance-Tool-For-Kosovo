apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: guri-finance
  labels:
    app: gateway
    tier: edge
spec:
  replicas: 2
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: edge
    spec:
      containers:
        - name: gateway
          image: gcr.io/guri-finance-prod/guri-gateway:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "400m"

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: guri-finance
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000

