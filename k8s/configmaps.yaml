apiVersion: v1
kind: ConfigMap
metadata:
  name: guri-common-config
  namespace: guri-finance
data:
  NODE_ENV: "production"
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC_OPERATIONS_EVENTS: "operations.events"
  KAFKA_TOPIC_LEDGER_EVENTS: "ledger.events"
  COMPLIANCE_SERVICE_URL: "http://compliance:3002"
  LEDGER_SERVICE_URL: "http://ledger:3004"
  AI_SERVICE_URL: "http://ai:3005"
  GEMINI_MODEL: "gemini-3-flash-preview"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iam-db-config
  namespace: guri-finance
data:
  IAM_DB_HOST: "iam-postgres"
  IAM_DB_PORT: "5432"
  IAM_DB_NAME: "guri_iam"
  IAM_DB_USER: "guri_iam"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-db-config
  namespace: guri-finance
data:
  OPS_DB_HOST: "ops-postgres"
  OPS_DB_PORT: "5432"
  OPS_DB_NAME: "guri_operations"
  OPS_DB_USER: "guri_ops"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-db-config
  namespace: guri-finance
data:
  LEDGER_DB_HOST: "ledger-postgres"
  LEDGER_DB_PORT: "5432"
  LEDGER_DB_NAME: "guri_ledger"
  LEDGER_DB_USER: "guri_ledger"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-db-config
  namespace: guri-finance
data:
  AI_DB_HOST: "ai-postgres"
  AI_DB_PORT: "5432"
  AI_DB_NAME: "guri_ai"
  AI_DB_USER: "guri_ai"
