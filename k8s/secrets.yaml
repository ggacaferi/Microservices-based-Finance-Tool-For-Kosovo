# ── Database password secrets ────────────────────────────
# In production: use Google Secret Manager or Sealed Secrets
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: guri-finance
type: Opaque
stringData:
  IAM_DB_PASSWORD: "changeme-iam"
  OPS_DB_PASSWORD: "changeme-ops"
  LEDGER_DB_PASSWORD: "changeme-ledger"
  AI_DB_PASSWORD: "changeme-ai"

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: guri-finance
type: Opaque
stringData:
  JWT_SECRET: "super-secret-jwt-key-rotate-quarterly"
