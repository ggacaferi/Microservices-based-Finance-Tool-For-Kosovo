# ──────────────────────────────────────────────────────────
# Postgres StatefulSets — One per bounded context
# Each service gets its own database instance for full
# data isolation as required by DDD bounded contexts.
# ──────────────────────────────────────────────────────────

# ── IAM Postgres ─────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iam-postgres
  namespace: guri-finance
  labels:
    app: iam-postgres
    tier: database
    context: iam
spec:
  serviceName: iam-postgres
  replicas: 1
  selector:
    matchLabels:
      app: iam-postgres
  template:
    metadata:
      labels:
        app: iam-postgres
        tier: database
        context: iam
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "guri_iam"
            - name: POSTGRES_USER
              value: "guri_iam"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: IAM_DB_PASSWORD
          volumeMounts:
            - name: iam-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "guri_iam"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: iam-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: iam-postgres
  namespace: guri-finance
spec:
  selector:
    app: iam-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None

