---
# ── AI Postgres (with pgvector) ──────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-postgres
  namespace: guri-finance
  labels:
    app: ai-postgres
    tier: database
    context: ai
spec:
  serviceName: ai-postgres
  replicas: 1
  selector:
    matchLabels:
      app: ai-postgres
  template:
    metadata:
      labels:
        app: ai-postgres
        tier: database
        context: ai
    spec:
      containers:
        - name: postgres
          # pgvector-enabled image for vector similarity search
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "guri_ai"
            - name: POSTGRES_USER
              value: "guri_ai"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: AI_DB_PASSWORD
          volumeMounts:
            - name: ai-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "guri_ai"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: ai-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ai-postgres
  namespace: guri-finance
spec:
  selector:
    app: ai-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
